services:
  - type: web
    name: growth-saas-copilot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn chat_grow.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: TZ
        value: Africa/Dakar

